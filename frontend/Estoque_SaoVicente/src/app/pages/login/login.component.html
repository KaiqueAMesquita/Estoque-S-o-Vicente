<div class="container">
    <span class="line"></span>
    <h3>LOGIN</h3>
    <form [formGroup]="loginForm" (ngSubmit)="submitForm($event)">
        <input type="text" placeholder="Nome" formControlName="username" [(ngModel)] = "username">
        <input type="password"  placeholder="Senha" formControlName="password" [(ngModel)] = "password" >


        <button>ENTRAR</button>
    </form>

</div>
